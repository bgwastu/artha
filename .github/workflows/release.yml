name: Release
on:
  push:
    branches: [main]
    paths:
      - 'artha/app/src/main/**'
      - 'artha/app/src/release/**'
      - 'artha/app/*.gradle*'
      - 'artha/app/proguard*.pro'
      - 'artha/bridge/**'
      - 'artha/ingestion/**'
      - 'artha/*.gradle*'
      - 'artha/gradle.properties'
      - 'artha/gradle/**'
      - 'artha/gradlew'
      - 'artha/gradlew.bat'
      - 'artha/buildSrc/**'
      - 'tools/release/**'
      - '.github/workflows/release.yml'
permissions:
  contents: write
concurrency:
  group: artha-release
  cancel-in-progress: false
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      ARTHA_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ARTHA_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ARTHA_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ARTHA_ANDROID_CERTIFICATE_SHA256: ${{ vars.ANDROID_CERTIFICATE_SHA256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-36 build-tools;36.0.0
      - uses: gradle/actions/setup-gradle@v4
      - id: version
        run: |
          number=$(git rev-list --count HEAD)
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "name=0.1.$number" >> "$GITHUB_OUTPUT"
      - name: Materialize signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: python3 tools/release/android-key.py
      - name: Check and build signed APK
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.number }}
        run: ./artha/gradlew -p artha -ParthaVersionName="$VERSION_NAME" -ParthaVersionCode="$VERSION_CODE" testDebugUnitTest assembleDebug assembleRelease lintDebug
      - name: Verify release signing identity
        run: |
          python3 - <<'PY'
          import os, re, subprocess
          signer = os.path.join(os.environ['ANDROID_HOME'], 'build-tools', '36.0.0', 'apksigner')
          expected = re.sub(r'[:\s]', '', os.environ['ARTHA_ANDROID_CERTIFICATE_SHA256']).lower()
          apks = [
              'artha/app/build/outputs/apk/release/app-release.apk',
              'artha/bridge/build/outputs/apk/release/bridge-release.apk'
          ]
          for apk in apks:
              output = subprocess.check_output([signer, 'verify', '--print-certs', apk], text=True)
              actual = re.search(r'certificate SHA-256 digest: (\w+)', output).group(1).lower()
              if not expected or actual != expected:
                  raise SystemExit(f'APK {apk} signing certificate does not match the release identity')
          PY
      - name: Stage APKs and update manifest
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.number }}
        run: |
          mkdir -p build/release
          cp artha/app/build/outputs/apk/release/app-release.apk "build/release/Artha-$VERSION_NAME.apk"
          cp artha/bridge/build/outputs/apk/release/bridge-release.apk "build/release/Artha-Bridge-$VERSION_NAME.apk"
          python3 - <<'PY'
          import hashlib, json, os

          version_name = os.environ['VERSION_NAME']
          version_code = int(os.environ['VERSION_CODE'])

          def get_info(path, filename):
              size = os.path.getsize(path)
              with open(path, 'rb') as f:
                  sha256 = hashlib.sha256(f.read()).hexdigest().lower()
              url = f"https://github.com/bgwastu/artha/releases/download/v{version_name}/{filename}"
              return {"url": url, "sha256": sha256, "size": size}

          manifest = {
              "versionCode": version_code,
              "versionName": version_name,
              "apps": {
                  "net.wastu.artha": get_info(f"build/release/Artha-{version_name}.apk", f"Artha-{version_name}.apk"),
                  "net.wastu.artha.bridge": get_info(f"build/release/Artha-Bridge-{version_name}.apk", f"Artha-Bridge-{version_name}.apk")
              }
          }

          with open("build/release/update.json", "w") as f:
              json.dump(manifest, f, indent=2)
          PY
          cd build/release
          sha256sum Artha-*.apk update.json > SHA256SUMS
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          gh release create "v$VERSION_NAME" build/release/* \
            --target "$GITHUB_SHA" \
            --title "Artha $VERSION_NAME" \
            --notes "Artha Android release built from $GITHUB_SHA." \
            --latest
      - name: Remove temporary key
        if: always()
        run: rm -f "$RUNNER_TEMP/artha-production-signing.keystore"
